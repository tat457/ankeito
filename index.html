<!-- CUSTOM MODAL CONFIRM DIALOG -->

        <p id="modalMessage" class="text-sm text-slate-600 leading-relaxed"></p>
        <div class="flex justify-end gap-3 pt-2">
            <button id="modalCancelBtn" type="button" class="px-4 py-2 bg-slate-100 hover:bg-slate-200 text-slate-700 text-sm font-medium rounded-lg transition">キャンセル</button>
            <button id="modalConfirmBtn" type="button" class="px-4 py-2 bg-blue-600 hover:bg-blue-700 text-white text-sm font-semibold rounded-lg transition">実行する</button>
        </div>
    </div>

<!-- TOAST NOTIFICATION CONTAINER -->
<div id="toastContainer" class="fixed bottom-5 right-5 z-50 space-y-2 pointer-events-none"></div>

<!-- JAVASCRIPT LOGIC -->
<script>
const MAX_QUESTIONS = 10;
const MAX_CHOICES = 5;
const DB_NAME = "survey-app-db";
const DB_VERSION = 1;
const SURVEY_STORE = "surveys";
const APP_STATE_STORE = "appState";
const DRAFT_KEY = "draftSurvey";

const emptySurveyData = () => ({
    questions: [],
    currentQuestionIndex: 0
});

let surveyData = emptySurveyData();
let editingSurveyId = null; // Track current editing saved survey ID
let storageMode = "memory";
let dbPromise = null;

// UI Helper: Toast message
function showToast(message, type = "info") {
    const container = document.getElementById("toastContainer");
    const toast = document.createElement("div");
    
    let bgColor = "bg-slate-800 text-white";
    if (type === "success") bgColor = "bg-emerald-600 text-white";
    if (type === "error") bgColor = "bg-rose-600 text-white";

    toast.className = `${bgColor} px-4 py-3 rounded-xl shadow-lg text-sm font-medium transition-all duration-300 transform translate-y-2 opacity-0 pointer-events-auto flex items-center gap-2 max-w-xs`;
    toast.textContent = message;

    container.appendChild(toast);

    requestAnimationFrame(() => {
        toast.classList.remove("translate-y-2", "opacity-0");
    });

    setTimeout(() => {
        toast.classList.add("opacity-0", "translate-y-2");
        setTimeout(() => toast.remove(), 300);
    }, 3000);
}

// UI Helper: Modal confirm dialog
function customConfirm(message, title = "確認") {
    return new Promise((resolve) => {
        const overlay = document.getElementById("modalOverlay");
        const modalTitle = document.getElementById("modalTitle");
        const modalMessage = document.getElementById("modalMessage");
        const cancelBtn = document.getElementById("modalCancelBtn");
        const confirmBtn = document.getElementById("modalConfirmBtn");

        modalTitle.textContent = title;
        modalMessage.textContent = message;

        overlay.classList.remove("hidden");

        const cleanup = () => {
            overlay.classList.add("hidden");
            cancelBtn.removeEventListener("click", onCancel);
            confirmBtn.removeEventListener("click", onConfirm);
        };

        const onCancel = () => {
            cleanup();
            resolve(false);
        };

        const onConfirm = () => {
            cleanup();
            resolve(true);
        };

        cancelBtn.addEventListener("click", onCancel);
        confirmBtn.addEventListener("click", onConfirm);
    });
}

// Screen display switcher helper
function showScreen(screenId) {
    document.getElementById("setupScreen").classList.add("hidden");
    document.getElementById("voteScreen").classList.add("hidden");
    document.getElementById("resultScreen").classList.add("hidden");

    const target = document.getElementById(screenId);
    if (target) {
        target.classList.remove("hidden");
        window.scrollTo({ top: 0, behavior: "smooth" });
    }
}

function getLocalStorageSafe() {
    try {
        return window.localStorage;
    } catch (error) {
        return null;
    }
}

function openDatabase() {
    if (!("indexedDB" in window)) {
        return Promise.reject(new Error("IndexedDB is not supported"));
    }

    if (dbPromise) return dbPromise;

    dbPromise = new Promise((resolve, reject) => {
        const request = window.indexedDB.open(DB_NAME, DB_VERSION);

        request.onupgradeneeded = () => {
            const db = request.result;
            if (!db.objectStoreNames.contains(SURVEY_STORE)) {
                db.createObjectStore(SURVEY_STORE, { keyPath: "id" });
            }
            if (!db.objectStoreNames.contains(APP_STATE_STORE)) {
                db.createObjectStore(APP_STATE_STORE, { keyPath: "key" });
            }
        };

        request.onsuccess = () => resolve(request.result);
        request.onerror = () => reject(request.error || new Error("IndexedDB open failed"));
    });

    return dbPromise;
}

function requestToPromise(request) {
    return new Promise((resolve, reject) => {
        request.onsuccess = () => resolve(request.result);
        request.onerror = () => reject(request.error || new Error("Database request failed"));
    });
}

function cloneSurveyData(data) {
    return JSON.parse(JSON.stringify(data));
}

function isHeicFile(file) {
    if (!file) return false;
    const name = typeof file.name === "string" ? file.name.toLowerCase() : "";
    const type = typeof file.type === "string" ? file.type.toLowerCase() : "";
    return name.endsWith(".heic") || name.endsWith(".heif") || type.includes("heic") || type.includes("heif");
}

function fileToDataUrl(file) {
    return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => resolve(typeof reader.result === "string" ? reader.result : "");
        reader.onerror = () => reject(new Error("画像の読み込みに失敗しました"));
        reader.readAsDataURL(file);
    });
}

async function convertHeicToDataUrl(file) {
    if (typeof heic2any !== "function") {
        throw new Error("HEIC変換ライブラリを読み込めませんでした");
    }

    const convertedBlob = await heic2any({
        blob: file,
        toType: "image/jpeg",
        quality: 0.85
    });

    const blob = Array.isArray(convertedBlob) ? convertedBlob[0] : convertedBlob;
    return fileToDataUrl(blob);
}

function normalizeChoice(choice) {
    if (typeof choice === "string") {
        return { text: choice, image: "" };
    }
    if (!choice || typeof choice.text !== "string") return null;
    return {
        text: choice.text,
        image: typeof choice.image === "string" ? choice.image : ""
    };
}

// Storage Initialization
async function initializeStorage() {
    try {
        await openDatabase();
        storageMode = "indexedDB";
    } catch (error) {
        const localStorageRef = getLocalStorageSafe();
        if (localStorageRef) {
            storageMode = "localStorage";
        } else {
            storageMode = "memory";
        }
    }
}

async function readAppState(key) {
    if (storageMode === "indexedDB") {
        const db = await openDatabase();
        const tx = db.transaction(APP_STATE_STORE, "readonly");
        const store = tx.objectStore(APP_STATE_STORE);
        const result = await requestToPromise(store.get(key));
        return result ? result.value : null;
    }
    if (storageMode === "localStorage") {
        const storage = getLocalStorageSafe();
        if (!storage) return null;
        const raw = storage.getItem(key);
        return raw ? JSON.parse(raw) : null;
    }
    return null;
}

async function writeAppState(key, value) {
    if (storageMode === "indexedDB") {
        const db = await openDatabase();
        const tx = db.transaction(APP_STATE_STORE, "readwrite");
        const store = tx.objectStore(APP_STATE_STORE);
        await requestToPromise(store.put({ key, value }));
        return;
    }
    if (storageMode === "localStorage") {
        const storage = getLocalStorageSafe();
        if (!storage) return;
        storage.setItem(key, JSON.stringify(value));
    }
}

async function removeAppState(key) {
    if (storageMode === "indexedDB") {
        const db = await openDatabase();
        const tx = db.transaction(APP_STATE_STORE, "readwrite");
        const store = tx.objectStore(APP_STATE_STORE);
        await requestToPromise(store.delete(key));
        return;
    }
    if (storageMode === "localStorage") {
        const storage = getLocalStorageSafe();
        if (!storage) return;
        storage.removeItem(key);
    }
}

// Saved Surveys Storage API
async function listSavedSurveys() {
    if (storageMode === "indexedDB") {
        const db = await openDatabase();
        const tx = db.transaction(SURVEY_STORE, "readonly");
        const store = tx.objectStore(SURVEY_STORE);
        const items = await requestToPromise(store.getAll());
        return items.sort((a, b) => b.savedAt - a.savedAt);
    }
    if (storageMode === "localStorage") {
        const storage = getLocalStorageSafe();
        if (!storage) return [];
        const raw = storage.getItem("savedSurveys");
        const items = raw ? JSON.parse(raw) : [];
        return Array.isArray(items) ? items.sort((a, b) => b.savedAt - a.savedAt) : [];
    }
    return [];
}

async function persistSavedSurveys(items) {
    if (storageMode !== "localStorage") return;
    const storage = getLocalStorageSafe();
    if (!storage) return;
    storage.setItem("savedSurveys", JSON.stringify(items));
}

async function saveNamedSurvey(name, targetId = null) {
    const id = targetId || ("survey-" + Date.now() + "-" + Math.random().toString(16).slice(2));
    const payload = {
        id,
        name,
        savedAt: Date.now(),
        data: cloneSurveyData(surveyData)
    };

    if (storageMode === "indexedDB") {
        const db = await openDatabase();
        const tx = db.transaction(SURVEY_STORE, "readwrite");
        const store = tx.objectStore(SURVEY_STORE);
        await requestToPromise(store.put(payload));
        return id;
    }

    if (storageMode === "localStorage") {
        const items = await listSavedSurveys();
        const idx = items.findIndex((i) => i.id === id);
        if (idx >= 0) {
            items[idx] = payload;
        } else {
            items.push(payload);
        }
        await persistSavedSurveys(items);
        return id;
    }
    return id;
}

async function loadNamedSurvey(id) {
    if (storageMode === "indexedDB") {
        const db = await openDatabase();
        const tx = db.transaction(SURVEY_STORE, "readonly");
        const store = tx.objectStore(SURVEY_STORE);
        return requestToPromise(store.get(id));
    }
    if (storageMode === "localStorage") {
        const items = await listSavedSurveys();
        return items.find((item) => item.id === id) || null;
    }
    return null;
}

async function deleteNamedSurvey(id) {
    if (storageMode === "indexedDB") {
        const db = await openDatabase();
        const tx = db.transaction(SURVEY_STORE, "readwrite");
        const store = tx.objectStore(SURVEY_STORE);
        await requestToPromise(store.delete(id));
        return;
    }
    if (storageMode === "localStorage") {
        const items = await listSavedSurveys();
        const filtered = items.filter((item) => item.id !== id);
        await persistSavedSurveys(filtered);
    }
}

async function saveData() {
    if (storageMode === "memory") return;
    try {
        await writeAppState(DRAFT_KEY, surveyData);
    } catch (error) {
        console.error("保存失敗", error);
    }
}

// Data validation and normalization
function isValidSurveyData(data) {
    if (!data || !Array.isArray(data.questions)) return false;
    if (typeof data.currentQuestionIndex !== "number" || !Number.isInteger(data.currentQuestionIndex)) return false;
    if (data.questions.length === 0 || data.questions.length > MAX_QUESTIONS) return false;

    return data.questions.every((item) => {
        if (!item || typeof item.question !== "string") return false;
        if (!Array.isArray(item.choices) || !Array.isArray(item.votes)) return false;
        if (item.choices.length < 2 || item.choices.length > MAX_CHOICES) return false;
        return item.choices.every((choice) => normalizeChoice(choice) !== null);
    });
}

function normalizeSurveyData(data) {
    if (!isValidSurveyData(data)) return null;
    return {
        questions: data.questions.map((item) => {
            const choices = item.choices.map((choice) => normalizeChoice(choice));
            let votes = Array.isArray(item.votes) ? [...item.votes] : [];
            if (votes.length !== choices.length) {
                votes = new Array(choices.length).fill(0);
            }
            return {
                question: item.question,
                choices: choices,
                votes: votes
            };
        }),
        currentQuestionIndex: Math.max(0, Math.min(data.currentQuestionIndex || 0, data.questions.length - 1))
    };
}

function getSetupFormData() {
    const blocks = document.querySelectorAll(".questionBlock");
    const questionsList = [];

    blocks.forEach((block) => {
        const questionInput = block.querySelector(".questionInput");
        const questionText = questionInput ? questionInput.value : "";

        const choices = [];
        for (let choiceIndex = 0; choiceIndex < MAX_CHOICES; choiceIndex += 1) {
            const choiceInput = block.querySelector(`.choiceInput[data-choice-index="${choiceIndex}"]`);
            const imageInput = block.querySelector(`.choiceImageInput[data-choice-index="${choiceIndex}"]`);
            const value = choiceInput ? choiceInput.value : "";
            const image = imageInput && typeof imageInput.dataset.imageData === "string" ? imageInput.dataset.imageData : "";

            choices.push({
                text: value,
                image: image
            });
        }

        questionsList.push({
            question: questionText,
            choices: choices
        });
    });

    return questionsList;
}

function renderSetupInputs(dataToPrefill = null) {
    const area = document.getElementById("questionFormArea");
    area.textContent = "";

    let questionsList = [];
    if (dataToPrefill && Array.isArray(dataToPrefill.questions) && dataToPrefill.questions.length > 0) {
        questionsList = dataToPrefill.questions;
    } else {
        // デフォルトは1件
        questionsList = [{ question: "", choices: [] }];
    }

    questionsList.forEach((existingQ, questionIndex) => {
        const block = document.createElement("section");
        block.className = "questionBlock p-5 bg-slate-50 border border-slate-200 rounded-xl space-y-4 shadow-sm";

        const titleHeader = document.createElement("div");
        titleHeader.className = "flex items-center justify-between border-b border-slate-200/60 pb-2";
        
        const title = document.createElement("h3");
        title.className = "text-sm font-bold text-slate-800 flex items-center gap-2";
        title.innerHTML = `<span class="w-5 h-5 flex items-center justify-center bg-blue-600 text-white rounded-full text-xs font-bold">${questionIndex + 1}</span> 質問 ${questionIndex + 1}`;
        titleHeader.appendChild(title);

        const rightControls = document.createElement("div");
        rightControls.className = "flex items-center gap-2";

        if (questionIndex >= 1) {
            const optionalTag = document.createElement("span");
            optionalTag.className = "text-[10px] uppercase font-semibold text-slate-400 bg-slate-200/60 px-2 py-0.5 rounded";
            optionalTag.textContent = "追加質問";
            rightControls.appendChild(optionalTag);
        }

        // Delete question button
        if (questionsList.length > 1) {
            const deleteQBtn = document.createElement("button");
            deleteQBtn.type = "button";
            deleteQBtn.className = "text-xs text-rose-600 hover:text-rose-800 font-medium hover:bg-rose-50 px-2.5 py-1 rounded-md transition flex items-center gap-1 border border-rose-200";
            deleteQBtn.innerHTML = `<svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/></svg> 質問を削除`;
            deleteQBtn.addEventListener("click", () => {
                removeQuestionAt(questionIndex);
            });
            rightControls.appendChild(deleteQBtn);
        }

        titleHeader.appendChild(rightControls);
        block.appendChild(titleHeader);

        const questionInput = document.createElement("input");
        questionInput.className = "questionInput w-full px-3.5 py-2.5 text-sm bg-white border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 font-medium";
        questionInput.placeholder = `質問文を入力 (例: お気に入りの季節は？)`;
        questionInput.value = existingQ ? existingQ.question : "";
        questionInput.setAttribute("data-question-index", String(questionIndex));
        block.appendChild(questionInput);

        const choicesContainer = document.createElement("div");
        choicesContainer.className = "space-y-3 pt-1";

        for (let choiceIndex = 0; choiceIndex < MAX_CHOICES; choiceIndex += 1) {
            const existingChoice = existingQ && existingQ.choices && existingQ.choices[choiceIndex] ? existingQ.choices[choiceIndex] : null;

            const choiceGroup = document.createElement("div");
            choiceGroup.className = "p-3 bg-white border border-slate-200/80 rounded-lg space-y-2";

            const choiceLabel = document.createElement("div");
            choiceLabel.className = "text-[11px] font-semibold text-slate-400";
            choiceLabel.textContent = `選択肢 ${choiceIndex + 1} ${choiceIndex >= 2 ? '(任意)' : '(必須)'}`;
            choiceGroup.appendChild(choiceLabel);

            const choiceInput = document.createElement("input");
            choiceInput.className = "choiceInput w-full px-3 py-2 text-xs border border-slate-200 rounded-md focus:outline-none focus:ring-1 focus:ring-blue-500";
            choiceInput.placeholder = `選択肢のテキストを入力`;
            choiceInput.value = existingChoice ? existingChoice.text : "";
            choiceInput.setAttribute("data-question-index", String(questionIndex));
            choiceInput.setAttribute("data-choice-index", String(choiceIndex));
            choiceGroup.appendChild(choiceInput);

            const fileArea = document.createElement("div");
            fileArea.className = "flex items-center gap-2 text-xs text-slate-500";

            const imageInput = document.createElement("input");
            imageInput.type = "file";
            imageInput.accept = "image/*";
            imageInput.className = "choiceImageInput text-xs text-slate-500 file:mr-2 file:py-1 file:px-2.5 file:rounded-md file:border-0 file:text-xs file:font-medium file:bg-blue-50 file:text-blue-700 hover:file:bg-blue-100 cursor-pointer";
            imageInput.setAttribute("data-question-index", String(questionIndex));
            imageInput.setAttribute("data-choice-index", String(choiceIndex));
            if (existingChoice && existingChoice.image) {
                imageInput.dataset.imageData = existingChoice.image;
            }

            fileArea.appendChild(imageInput);
            choiceGroup.appendChild(fileArea);

            const preview = document.createElement("img");
            preview.className = `choiceImagePreview max-h-36 object-contain rounded-lg border border-slate-200 bg-slate-50 mt-2 ${existingChoice && existingChoice.image ? "" : "hidden"}`;
            if (existingChoice && existingChoice.image) {
                preview.src = existingChoice.image;
            }
            preview.alt = "選択肢画像プレビュー";
            choiceGroup.appendChild(preview);

            imageInput.addEventListener("change", () => {
                void handleChoiceImageChange(imageInput, preview);
            });

            choicesContainer.appendChild(choiceGroup);
        }

        block.appendChild(choicesContainer);
        area.appendChild(block);
    });

    // Update Add Question Button state
    const addQuestionBtn = document.getElementById("addQuestionBtn");
    if (addQuestionBtn) {
        if (questionsList.length >= MAX_QUESTIONS) {
            addQuestionBtn.disabled = true;
            addQuestionBtn.classList.add("opacity-50", "cursor-not-allowed");
        } else {
            addQuestionBtn.disabled = false;
            addQuestionBtn.classList.remove("opacity-50", "cursor-not-allowed");
        }
    }
}

// Image upload preview handler
async function handleChoiceImageChange(input, preview) {
    const file = input.files && input.files[0];
    if (!file) {
        input.dataset.imageData = "";
        preview.src = "";
        preview.classList.add("hidden");
        return;
    }

    if (!file.type.startsWith("image/") && !isHeicFile(file)) {
        input.value = "";
        input.dataset.imageData = "";
        preview.src = "";
        preview.classList.add("hidden");
        showToast("画像ファイルを選択してください", "error");
        return;
    }

    try {
        showToast("画像を読み込み中...", "info");
        const dataUrl = isHeicFile(file)
            ? await convertHeicToDataUrl(file)
            : await fileToDataUrl(file);

        input.dataset.imageData = dataUrl;
        preview.src = dataUrl;
        preview.classList.remove("hidden");
        showToast("画像を読み込みました", "success");
    } catch (error) {
        input.value = "";
        input.dataset.imageData = "";
        preview.src = "";
        preview.classList.add("hidden");
        showToast(error.message || "画像の読み込みに失敗しました", "error");
    }
}

function addQuestion() {
    const currentQuestions = getSetupFormData();
    if (currentQuestions.length >= MAX_QUESTIONS) {
        showToast(`質問は最大${MAX_QUESTIONS}個までです`, "error");
        return;
    }

    currentQuestions.push({ question: "", choices: [] });
    renderSetupInputs({ questions: currentQuestions });
    showToast("質問を追加しました", "info");
}

function removeQuestionAt(index) {
    const currentQuestions = getSetupFormData();
    if (currentQuestions.length <= 1) {
        showToast("質問は最低1個必要です", "error");
        return;
    }

    currentQuestions.splice(index, 1);
    renderSetupInputs({ questions: currentQuestions });
    showToast(`質問 ${index + 1} を削除しました`, "info");
}

// Editing state UI updater
function updateEditingStateUI(surveyName = null) {
    const badge = document.getElementById("editingBadge");
    const badgeText = document.getElementById("editingBadgeText");
    const startBtnText = document.getElementById("startSurveyBtnText");

    if (editingSurveyId && surveyName) {
        badge.classList.remove("hidden");
        badge.classList.add("flex");
        badgeText.textContent = `✏️ 編集モード: 「${surveyName}」`;
        startBtnText.textContent = "編集後の内容で投票を開始する";
    } else {
        badge.classList.add("hidden");
        badge.classList.remove("flex");
        startBtnText.textContent = "アンケート投票を開始する";
    }
}

// Create or update survey logic from setup screen
async function createSurvey() {
    const blocks = document.querySelectorAll(".questionBlock");
    const questions = [];

    blocks.forEach((block, questionIndex) => {
        const questionInput = block.querySelector(".questionInput");
        const question = questionInput ? questionInput.value.trim() : "";
        if (question === "") return;

        const choices = [];

        for (let choiceIndex = 0; choiceIndex < MAX_CHOICES; choiceIndex += 1) {
            const choiceInput = block.querySelector(`.choiceInput[data-choice-index="${choiceIndex}"]`);
            const imageInput = block.querySelector(`.choiceImageInput[data-choice-index="${choiceIndex}"]`);
            const value = choiceInput ? choiceInput.value.trim() : "";
            const image = imageInput && typeof imageInput.dataset.imageData === "string"
                ? imageInput.dataset.imageData
                : "";

            if (value !== "" || image !== "") {
                choices.push({
                    text: value !== "" ? value : "画像の選択肢",
                    image
                });
            }
        }

        if (choices.length < 2) {
            throw new Error(`質問 ${questionIndex + 1} は選択肢を2つ以上入力してください`);
        }

        // Preserve vote counts if modifying matching question
        let existingVotes = new Array(choices.length).fill(0);
        if (editingSurveyId && surveyData.questions[questionIndex]) {
            const prevQ = surveyData.questions[questionIndex];
            if (prevQ.choices.length === choices.length) {
                existingVotes = [...prevQ.votes];
            }
        }

        questions.push({
            question,
            choices,
            votes: existingVotes
        });
    });

    if (questions.length === 0) {
        showToast("少なくとも1つは質問文を入力してください", "error");
        return;
    }

    surveyData = {
        questions,
        currentQuestionIndex: 0
    };

    await saveData();
    startVoteScreen();
}

function formatSavedAt(timestamp) {
    const date = new Date(timestamp);
    return date.toLocaleString("ja-JP", {
        month: "numeric",
        day: "numeric",
        hour: "2-digit",
        minute: "2-digit"
    });
}

async function renderSavedSurveys() {
    const area = document.getElementById("savedSurveysArea");
    const badge = document.getElementById("savedCountBadge");
    area.textContent = "";

    const items = await listSavedSurveys();
    badge.textContent = `${items.length}件`;

    if (items.length === 0) {
        area.innerHTML = `<div class="py-4 text-center text-slate-400">保存されたアンケートはありません</div>`;
        return;
    }

    items.forEach((item) => {
        const wrapper = document.createElement("div");
        wrapper.className = "p-3 bg-white rounded-xl border border-slate-200 flex flex-col sm:flex-row sm:items-center justify-between gap-3 shadow-sm hover:border-slate-300 transition";

        const info = document.createElement("div");
        info.className = "space-y-0.5";

        const title = document.createElement("div");
        title.className = "font-bold text-slate-800 text-sm";
        title.textContent = item.name;
        info.appendChild(title);

        const meta = document.createElement("div");
        meta.className = "text-[11px] text-slate-400 flex items-center gap-2";
        meta.textContent = `${item.data.questions.length}件の質問 ・ 保存日: ${formatSavedAt(item.savedAt)}`;
        info.appendChild(meta);

        wrapper.appendChild(info);

        const buttons = document.createElement("div");
        buttons.className = "flex items-center gap-1.5 shrink-0";

        // "開く（投票）" Button
        const openBtn = document.createElement("button");
        openBtn.type = "button";
        openBtn.className = "px-3 py-1.5 bg-blue-600 hover:bg-blue-700 text-white font-semibold rounded-lg text-xs transition shadow-sm";
        openBtn.textContent = "投票する";
        openBtn.addEventListener("click", async () => {
            try {
                const saved = await loadNamedSurvey(item.id);
                const normalized = saved ? normalizeSurveyData(saved.data) : null;
                if (!normalized) {
                    showToast("保存データを読み込めませんでした", "error");
                    return;
                }

                surveyData = normalized;
                editingSurveyId = item.id;
                await saveData();
                startVoteScreen();
                showToast(`「${item.name}」の投票画面を開きました`, "success");
            } catch (err) {
                showToast("開く処理に失敗しました", "error");
            }
        });
        buttons.appendChild(openBtn);

        // "編集" Button
        const editBtn = document.createElement("button");
        editBtn.type = "button";
        editBtn.className = "px-3 py-1.5 bg-slate-100 hover:bg-slate-200 text-slate-700 font-semibold rounded-lg text-xs transition border border-slate-200";
        editBtn.textContent = "編集";
        editBtn.addEventListener("click", async () => {
            try {
                const saved = await loadNamedSurvey(item.id);
                const normalized = saved ? normalizeSurveyData(saved.data) : null;
                if (!normalized) {
                    showToast("保存データを読み込めませんでした", "error");
                    return;
                }

                surveyData = normalized;
                editingSurveyId = item.id;
                updateEditingStateUI(item.name);
                renderSetupInputs(surveyData);
                showScreen("setupScreen");
                showToast(`「${item.name}」の編集モードに入りました`, "info");
            } catch (err) {
                showToast("編集データの読み込みに失敗しました", "error");
            }
        });
        buttons.appendChild(editBtn);

        // "削除" Button
        const deleteBtn = document.createElement("button");
        deleteBtn.type = "button";
        deleteBtn.className = "p-1.5 text-slate-400 hover:text-rose-600 hover:bg-rose-50 rounded-lg transition";
        deleteBtn.innerHTML = `<svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/></svg>`;
        deleteBtn.title = "削除";
        deleteBtn.addEventListener("click", async () => {
            const confirmed = await customConfirm(`保存アンケート「${item.name}」を削除してもよろしいですか？`, "アンケートの削除");
            if (!confirmed) return;

            await deleteNamedSurvey(item.id);
            if (editingSurveyId === item.id) {
                editingSurveyId = null;
                updateEditingStateUI(null);
            }
            await renderSavedSurveys();
            showToast("アンケートを削除しました", "info");
        });
        buttons.appendChild(deleteBtn);

        wrapper.appendChild(buttons);
        area.appendChild(wrapper);
    });
}

function startVoteScreen() {
    showScreen("voteScreen");
    renderCurrentQuestion();
}

function renderCurrentQuestion() {
    if (!surveyData.questions || surveyData.questions.length === 0) return;

    const current = surveyData.questions[surveyData.currentQuestionIndex];
    const area = document.getElementById("choicesArea");

    document.getElementById("questionCounter").textContent =
        `質問 ${surveyData.currentQuestionIndex + 1} / ${surveyData.questions.length}`;

    document.getElementById("questionText").textContent = current.question;
    area.textContent = "";

    current.choices.forEach((choice, index) => {
        const button = document.createElement("button");
        button.type = "button";
        button.className = "w-full text-left p-4 bg-white hover:bg-blue-50/50 active:bg-blue-100/60 border-2 border-slate-200 hover:border-blue-500 rounded-2xl transition duration-150 flex flex-col items-center justify-center space-y-3 shadow-sm group";

        const text = document.createElement("div");
        text.className = "font-bold text-slate-800 text-base text-center group-hover:text-blue-700 transition";
        text.textContent = choice.text;
        button.appendChild(text);

        if (choice.image) {
            const image = document.createElement("img");
            image.className = "w-full max-h-48 object-contain rounded-xl border border-slate-100 bg-slate-50";
            image.src = choice.image;
            image.alt = choice.text || "選択肢画像";
            button.appendChild(image);
        }

        button.addEventListener("click", () => vote(index));
        area.appendChild(button);
    });

    document.getElementById("prevQuestionButton").disabled = surveyData.currentQuestionIndex === 0;
    document.getElementById("nextQuestionButton").disabled = surveyData.currentQuestionIndex === surveyData.questions.length - 1;
}

function moveQuestion(step) {
    const nextIndex = surveyData.currentQuestionIndex + step;
    if (nextIndex < 0 || nextIndex >= surveyData.questions.length) return;

    surveyData.currentQuestionIndex = nextIndex;
    void saveData();
    renderCurrentQuestion();
}

function vote(choiceIndex) {
    const current = surveyData.questions[surveyData.currentQuestionIndex];
    current.votes[choiceIndex] += 1;
    void saveData();
    showToast(`「${current.choices[choiceIndex].text}」に投票しました！`, "success");
}

function showResults() {
    showScreen("resultScreen");

    const area = document.getElementById("resultsArea");
    area.textContent = "";

    let totalVotesOverall = 0;

    surveyData.questions.forEach((item, questionIndex) => {
        const section = document.createElement("section");
        section.className = "space-y-4 bg-slate-50 p-5 rounded-2xl border border-slate-200/80";

        const qTotalVotes = item.votes.reduce((a, b) => a + b, 0);
        totalVotesOverall += qTotalVotes;

        const titleHeader = document.createElement("div");
        titleHeader.className = "flex items-center justify-between border-b border-slate-200 pb-2";

        const title = document.createElement("h3");
        title.className = "text-base font-bold text-slate-800 flex items-center gap-2";
        title.innerHTML = `<span class="w-5 h-5 flex items-center justify-center bg-indigo-600 text-white rounded-full text-xs font-bold">${questionIndex + 1}</span> ${item.question}`;
        titleHeader.appendChild(title);

        const votesBadge = document.createElement("span");
        votesBadge.className = "text-xs font-semibold text-slate-500 bg-white px-2.5 py-1 rounded-md border border-slate-200";
        votesBadge.textContent = `合計 ${qTotalVotes} 票`;
        titleHeader.appendChild(votesBadge);

        section.appendChild(titleHeader);

        const choicesGrid = document.createElement("div");
        choicesGrid.className = "space-y-3 pt-1";

        item.choices.forEach((choice, choiceIndex) => {
            const voteCount = item.votes[choiceIndex];
            const pct = qTotalVotes > 0 ? Math.round((voteCount / qTotalVotes) * 100) : 0;

            const resultItem = document.createElement("div");
            resultItem.className = "p-3.5 bg-white rounded-xl border border-slate-200/80 space-y-2 shadow-xs";

            const labelRow = document.createElement("div");
            labelRow.className = "flex justify-between items-center text-sm font-semibold text-slate-800";

            const nameText = document.createElement("span");
            nameText.textContent = choice.text;
            labelRow.appendChild(nameText);

            const countText = document.createElement("span");
            countText.className = "text-indigo-600 font-bold";
            countText.textContent = `${voteCount} 票 (${pct}%)`;
            labelRow.appendChild(countText);

            resultItem.appendChild(labelRow);

            // Progress bar
            const barBg = document.createElement("div");
            barBg.className = "w-full h-3 bg-slate-100 rounded-full overflow-hidden";

            const barFill = document.createElement("div");
            barFill.className = "h-full bg-indigo-600 rounded-full transition-all duration-500 ease-out";
            barFill.style.width = `${pct}%`;
            barBg.appendChild(barFill);

            resultItem.appendChild(barBg);

            if (choice.image) {
                const image = document.createElement("img");
                image.className = "max-h-32 object-contain rounded-lg border border-slate-100 bg-slate-50 mt-2";
                image.src = choice.image;
                image.alt = choice.text || "選択肢画像";
                resultItem.appendChild(image);
            }

            choicesGrid.appendChild(resultItem);
        });

        section.appendChild(choicesGrid);
        area.appendChild(section);
    });

    document.getElementById("totalVotesSummary").textContent = `全質問 累計投票数: ${totalVotesOverall}票`;
}

// Save named survey
async function saveCurrentSurveyByName() {
    if (!isValidSurveyData(surveyData)) {
        showToast("保存できるアンケートデータがありません", "error");
        return;
    }

    const input = document.getElementById("saveSurveyNameInput");
    const name = input.value.trim();

    if (name === "") {
        showToast("保存名を入力してください", "error");
        return;
    }

    try {
        const savedId = await saveNamedSurvey(name, editingSurveyId);
        editingSurveyId = savedId;
        updateEditingStateUI(name);
        input.value = "";
        await renderSavedSurveys();
        showToast(`「${name}」として保存しました`, "success");
    } catch (err) {
        showToast("保存処理に失敗しました", "error");
    }
}

async function backToSetup() {
    const confirmed = await customConfirm("アンケートの作成・編集画面に戻りますか？", "画面の移動");
    if (!confirmed) return;

    editingSurveyId = null;
    updateEditingStateUI(null);
    surveyData = emptySurveyData();
    renderSetupInputs();
    showScreen("setupScreen");
}

async function resetVotes() {
    const confirmed = await customConfirm("現在の投票結果を全て0にリセットしますか？", "投票リセット");
    if (!confirmed) return;

    surveyData.questions.forEach((item) => {
        item.votes = new Array(item.choices.length).fill(0);
    });

    await saveData();
    showToast("投票数をリセットしました", "info");
    renderCurrentQuestion();
}

// App Initialization
async function initializeApp() {
    await initializeStorage();
    await renderSavedSurveys();

    // Check if draft state exists
    try {
        const draft = await readAppState(DRAFT_KEY);
        const normalized = normalizeSurveyData(draft);
        if (normalized) {
            surveyData = normalized;
            startVoteScreen();
            return;
        }
    } catch (e) {
        console.warn("No draft found");
    }

    // Default setup screen
    renderSetupInputs();
    showScreen("setupScreen");
}

// Event Listeners
document.getElementById("addQuestionBtn").addEventListener("click", addQuestion);

document.getElementById("createSurveyButton").addEventListener("click", () => {
    createSurvey().catch((error) => {
        showToast(error.message, "error");
    });
});

document.getElementById("cancelEditButton").addEventListener("click", () => {
    editingSurveyId = null;
    updateEditingStateUI(null);
    surveyData = emptySurveyData();
    renderSetupInputs();
    showToast("新規作成モードに戻りました", "info");
});

document.getElementById("editCurrentSurveyBtn").addEventListener("click", () => {
    renderSetupInputs(surveyData);
    showScreen("setupScreen");
});

document.getElementById("prevQuestionButton").addEventListener("click", () => moveQuestion(-1));
document.getElementById("nextQuestionButton").addEventListener("click", () => moveQuestion(1));
document.getElementById("showResultsButton").addEventListener("click", showResults);
document.getElementById("resetVotesButton").addEventListener("click", resetVotes);
document.getElementById("backToVoteButton").addEventListener("click", () => startVoteScreen());
document.getElementById("backToSetupButton").addEventListener("click", () => void backToSetup());
document.getElementById("backToSetupFromResultButton").addEventListener("click", () => void backToSetup());
document.getElementById("saveSurveyButton").addEventListener("click", () => void saveCurrentSurveyByName());

// Start application on load
window.onload = function () {
    void initializeApp();
};
</script>
